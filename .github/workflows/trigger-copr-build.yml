name: Trigger Copr build

on:
  push:
    branches: [master]
    paths:
      - '**/*.spec'
      - '**/asound.state'
      - '**/disable-random-mac.conf'
      - '**/s2idle.conf'

jobs:
  trigger-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Trigger Copr builds for changed packages
        run: |
          WEBHOOK_BASE="https://copr.fedorainfracloud.org/webhooks/github/34123/fd1a5d9e-d982-4004-b5a8-b8e660deb58f"

          # Get list of changed directories containing spec files
          CHANGED_DIRS=$(git diff --name-only HEAD~1 HEAD | grep -E '\.(spec|state|conf)$' | xargs -I{} dirname {} | sort -u)

          for dir in $CHANGED_DIRS; do
            # Skip hidden directories and root
            if [[ "$dir" == "." || "$dir" == .* ]]; then
              continue
            fi

            PKG_NAME=$(basename "$dir")

            # Check if this directory has a spec file
            if [[ -f "${dir}/${PKG_NAME}.spec" ]]; then
              echo "Triggering build for: $PKG_NAME"
              curl -X POST "${WEBHOOK_BASE}/${PKG_NAME}/" \
                -H "Content-Type: application/json" \
                -d '{"ref": "refs/heads/master"}' \
                --fail --silent --show-error || echo "Warning: Failed to trigger $PKG_NAME"
            fi
          done
